<div class="fixed inset-0 bg-black/70 flex items-center justify-center backdrop-blur-xl">
    <div class="flex flex-col items-center bg-yellow-200 border-b-black p-6 gap-2 w-[30%] h-[80%] rounded-2xl">

        @if(pokemonModal) {
        <p class="font-pixel text-xl">{{pokemonModal.detail.name}}</p>
        <p class="font-pixel text-[13px]">ID: {{pokemonModal.detail.id}}</p>

        <div class="flex justify-center items-center gap-10 border-2 border-black p-4 bg-blue-100">
            <img class="w-40 h-40 image-rendering-pixelated" [src]="pokemonModal.detail.sprites.front_default" alt="">
            <img class="w-40 h-40 image-rendering-pixelated" [src]="pokemonModal.detail.sprites.back_default" alt="">
        </div>

        <div class="pl-10 pt-6 grid grid-cols-2">
            <p class="font-pixel text-xs mt-2">Habilidades:</p>

            <div class="flex flex-col">
                @for (ability of pokemonModal.detail.abilities; track $index) {
                <p class="text-xl capitalize">{{ability.ability.name}}</p>
                }
            </div>

            <div class="flex flex-col gap-4 justify-center pt-6">
                <p class="text-xl capitalize"><span class="font-pixel text-xs">Color:
                    </span>{{pokemonModal.evolution.color.name}}
                </p>
                <p class="flex items-baseline text-xl pt-4 gap-2 capitalize"><span class="font-pixel text-xs">Hábitat:
                    </span>{{pokemonModal.evolution.habitat.name}}</p>
            </div>

        </div>
        }

        <button (click)="closeModal()"
            class="w-[30%] font-pixel text-[10px] border-2 bg-cyan-200 p-1 rounded-sm cursor-pointer hover:bg-cyan-300 mt-10">Cerrar</button>
    </div>
</div>
